<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- Primary SEO & Brand Meta -->
    <title>SkillFit – Discover Your Tech Track</title>
    <meta name="description" content="Discover your ideal tech track with Skillfit by meian.lab x Community Innovation Hub." />
    <meta name="theme-color" content="#2B5FFF" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Standard Favicons & Touch Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- iOS Safari PWA Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SkillFit" />

    <!-- Android PWA Meta -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900 antialiased selection:bg-[#2B5FFF] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <script>
      // Register Service Worker for PWA installation & offline caching
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then((registration) => {
              console.log('[SkillFit PWA] ServiceWorker registered with scope:', registration.scope);
            })
            .catch((error) => {
              console.error('[SkillFit PWA] ServiceWorker registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
