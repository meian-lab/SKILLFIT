<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <!-- PWA theme -->
  <meta name="theme-color" content="#2B5FFF" />
  <meta name="description"
    content="Discover your ideal tech track with Skillfit by meian.lab x Community Innovation Hub." />

  <!-- ✅ Apple / iOS PWA meta tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SkillFit" />

  <!-- Apple touch icons (iOS uses these for the home screen icon) -->
  <link rel="apple-touch-icon" href="/icon.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="/icon.png" />
  <link rel="apple-touch-icon" sizes="167x167" href="/icon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icon.png" />

  <!-- Apple splash screens (optional but polished) -->
  <link rel="apple-touch-startup-image" href="/splash_logo.png" />

  <!-- Android PWA -->
  <meta name="mobile-web-app-capable" content="yes" />

  <title>SkillFit – Discover Your Tech Track</title>

  <!-- PWA manifest -->
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" href="/icon.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;900&display=swap"
    rel="stylesheet" />
</head>

<body
  class="min-h-screen bg-white text-slate-900 antialiased selection:bg-[#2B5FFF] selection:text-white overflow-y-auto">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

  <script>
    // Register Service Worker for PWA (iOS Safari + Android Chrome)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js')
          .then(function (reg) {
            console.log('[SkillFit SW] Registered:', reg.scope);
          })
          .catch(function (err) {
            console.warn('[SkillFit SW] Registration failed:', err);
          });
      });
    }
  </script>
</body>

</html>
